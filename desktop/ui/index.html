<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>任务管理工作台</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a1020;
        color: #8a9ab8;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        justify-content: center;
        font-size: 13px;
      }
      button {
        padding: 6px 14px;
        border: 1px solid #2b3a5c;
        border-radius: 8px;
        background: #16203a;
        color: #e6ecf7;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="status">正在启动本地服务…</div>
    <button id="retry" style="display: none">重试</button>
    <script>
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");
      retry.onclick = () => boot();

      async function boot() {
        retry.style.display = "none";
        status.textContent = "正在启动本地服务…（首次开机可能需要 1 分钟）";
        for (let i = 0; i < 240; i += 1) {
          try {
            const response = await fetch("http://127.0.0.1:8787/api/health");
            if (response.ok) {
              window.location.replace("http://127.0.0.1:8787/?dock=1");
              return;
            }
          } catch (error) {
            /* server is still starting */
          }
          await new Promise((resolve) => setTimeout(resolve, 500));
        }
        status.textContent = "工作台服务没有启动，请检查后台服务。";
        retry.style.display = "inline-block";
      }

      boot();
    </script>
  </body>
</html>
